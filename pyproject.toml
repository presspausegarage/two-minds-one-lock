[project]
name = "two-minds-one-lock"
version = "0.1.0"
description = "Two agents, one seeded cipher lock, one MCP tool surface - does the smarter mind visibly win?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.28.1",
    "anthropic>=0.40",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[project.scripts]
tracer = "tracer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
