name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: setup-uv stopped publishing floating major
      # tags after v7, so @v9 does not resolve. Dependabot bumps this.
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
